name: Release

# Push a tag to publish a release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Tag matches the version in pyproject.toml
        run: |
          want="v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $want"; exit 1
          fi

      - name: Test
        run: |
          uv sync
          uv run pytest -q
          (cd app && go test -race ./...)

      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          On each computer (macOS or Linux):

          **1. The engine**, \`flipchat-radio\` (needs [uv](https://docs.astral.sh/uv/)):

          \`\`\`bash
          uv tool install git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}
          \`\`\`

          **2. The app**, \`flipchat\`, for your system (\`darwin\` = macOS; \`arm64\` = Apple Silicon / ARM, \`amd64\` = Intel / AMD):

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/flipchat_<os>_<arch>.tar.gz | tar -xz
          ./flipchat_<os>_<arch>/flipchat
          \`\`\`

          The listener also needs the RTL-SDR drivers (\`brew install librtlsdr\` / \`sudo apt install rtl-sdr\`).
          Full guide: [README](https://github.com/${GITHUB_REPOSITORY}#readme).

          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "flipchat $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
