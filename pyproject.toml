[project]
name = "flipchat-radio"
version = "0.1.0"
description = "Engine of flipchat: Flipper Zero Sub-GHz chat, sent with a Flipper and received with an RTL-SDR"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyserial>=3.5"]

[project.scripts]
flipchat-radio = "flipchat_radio.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
