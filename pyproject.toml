[project]
name = "flipcom-chat"
version = "0.1.0"
description = "Flipper Zero Sub-GHz chat: send with a Flipper, receive with an RTL-SDR dongle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyserial>=3.5"]

[project.scripts]
flipcom-chat = "flipcom_chat.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
